server {
    listen 80;
    server_name _;

    # Загрузка материалов миссии (видео до 300 МБ на стороне бэкенда). Без
    # этого nginx режет большие запросы с 413 ещё до Node. Тот же лимит должен
    # стоять и на хостовом reverse-proxy, который проксирует /api на бэкенд.
    client_max_body_size 300M;

    root /usr/share/nginx/html;
    index index.html;

    # Файлы миссий из MinIO. Обязан стоять выше SPA-фолбэка, иначе try_files
    # перехватит запрос и вернёт index.html вместо PDF.
    #
    # Адрес должен совпадать с MINIO_ENDPOINT:MINIO_PORT бэкенда: подпись SigV4
    # привязана к Host, при расхождении MinIO отвечает 403.
    location /uploads/ {
        proxy_pass http://94.141.81.82:9000/;
        proxy_set_header Host 94.141.81.82:9000;
        # Видео до 300 МБ — отдаём потоком, не копя ответ на диске.
        proxy_buffering off;
    }

    # SPA fallback: любой маршрут отдаём в index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики со собранными хэшами в именах
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
